name: Update site stats

on:
  schedule:
    - cron: "0 5 * * 1"      # every Monday 05:00 UTC
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scholarly (optional, for Google Scholar numbers)
        run: pip install scholarly

      - name: Fetch latest numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: JonasStage
          SCHOLAR_ID: "-6tGaCoAAAAJ"
          # Recommended: look up your ID on openalex.org (e.g. A5012345678) and paste it here.
          OPENALEX_AUTHOR_ID: ""
        run: python scripts/update_data.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update site stats" && git push)
